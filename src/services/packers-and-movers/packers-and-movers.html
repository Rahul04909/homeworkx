<app-header></app-header>
<section class="service">
  <header class="service-hero movers-hero">
    <div class="hero-content"></div>
  </header>

  <div class="service-container">
    <div class="features-grid">
      <div class="feature-card">
        <h3>Verified Movers</h3>
        <p>Screened partners with proven reliability.</p>
      </div>
      <div class="feature-card">
        <h3>Packing & Handling</h3>
        <p>Careful packaging and safe transport.</p>
      </div>
      <div class="feature-card">
        <h3>Insurance Options</h3>
        <p>Coverage for high‑value items and equipment.</p>
      </div>
      <div class="feature-card">
        <h3>On‑Time Delivery</h3>
        <p>Coordinated schedules and clear updates.</p>
      </div>
    </div>

    <div class="advert-banner"></div>

    <div class="enquiry-card">
      <div>
        <h2>Moving Enquiry</h2>
        <form novalidate class="enquiry-form">
          <div class="form-row">
            <div class="form-field">
              <label for="name">Name</label>
              <input id="name" #name type="text" placeholder="Your name" required>
            </div>
            <div class="form-field">
              <label for="email">Email</label>
              <input id="email" #email type="email" placeholder="you@example.com" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-field">
              <label for="phone">Phone</label>
              <input id="phone" #phone type="tel" placeholder="+234…">
            </div>
            <div class="form-field">
              <label for="from">Move From</label>
              <input id="from" #from type="text" placeholder="City/Address">
            </div>
          </div>
          <div class="form-field">
            <label for="to">Move To</label>
            <input id="to" #to type="text" placeholder="City/Address">
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-primary" (click)="sendEmail(name.value, email.value, phone.value, from.value, to.value)">Send Enquiry</button>
          </div>
        </form>
      </div>
      <div class="enquiry-image"></div>
    </div>
  </div>
</section>
<app-footer></app-footer>
