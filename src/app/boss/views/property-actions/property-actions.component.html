<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col-md-6">
        Property Actions
      </div>
      <div class="col-md-6 text-end">
        <button class="btn btn-primary" (click)="addAction()">Add New Property Action</button>
      </div>
    </div>
  </div>
  <div class="card-body">


    <table class="table table-hover table-outline mb-0 d-none d-sm-table">
      <thead class="thead-light">
        <tr>
          <th>Id</th>
          <th>Property Action Type Name</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let action of propertyActions">
          <td>{{ action.id }}</td>
          <td>{{ action.name }}</td>
          <td>
            <button class="btn btn-sm" [ngClass]="{'btn-warning': action.status === 'Active', 'btn-success': action.status === 'Inactive'}" (click)="toggleStatus(action)">
              {{ action.status === 'Active' ? 'Disable' : 'Enable' }}
            </button>
          </td>
          <td>
            <button class="btn btn-info btn-sm" (click)="editAction(action)">Edit</button>
          </td>
        </tr>
      </tbody>
    </table>


  </div>
</div>
