<div class="card">
  <div class="card-header">
    Closure Requests
  </div>
  <div class="card-body">
    <div class="row mb-3">
      <div class="col-md-4">
        <input type="text" class="form-control" placeholder="Search requests..." [(ngModel)]="searchTerm" (input)="applyFilters()">
      </div>
      <!-- <div class="col-md-3">
        <select class="form-select" [(ngModel)]="filterType" (change)="applyFilters()">
          <option value="Customer">Customer</option>
          <option value="Agent">Agent</option>
          <option value="Owner">Owner</option>
        </select>
      </div>
      <div class="col-md-3">
        <select class="form-select" [(ngModel)]="filterStatus" (change)="applyFilters()">
          <option value="Pending">Pending</option>
          <option value="Approved">Approved</option>
          <option value="Rejected">Rejected</option>
        </select>
      </div> -->
    </div>
    <table class="table table-bordered table-striped">
      <thead>
        <tr>
          <th>#</th>
          <th>Type</th>
          <th>Name</th>
          <th>Email</th>
          <th>Request Date</th>

          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let request of pagedRequests; let i = index">
          <td>{{ (currentPage - 1) * itemsPerPage + i + 1 }}</td>
          <td>{{ request.type }}</td>
          <td>{{ request.name }}</td>
          <td>{{ request.email }}</td>
          <td>{{ request.requestDate }}</td>
          <td>
            <button *ngIf="request.status === 'Pending'" class="btn btn-sm btn-success me-2" (click)="approveRequest(request)">Approve</button>
            <button *ngIf="request.status === 'Pending'" class="btn btn-sm btn-danger" (click)="rejectRequest(request)">Reject</button>
          </td>
        </tr>
      </tbody>
    </table>
    <nav aria-label="Page navigation">
      <ul class="pagination">
        <li class="page-item" [class.disabled]="currentPage === 1">
          <a class="page-link" (click)="goToPage(1)">First</a>
        </li>
        <li class="page-item" [class.disabled]="currentPage === 1">
          <a class="page-link" (click)="goToPage(currentPage - 1)">Previous</a>
        </li>
        <li class="page-item" *ngFor="let page of totalPagesArray" [class.active]="page === currentPage">
          <a class="page-link" (click)="goToPage(page)">{{ page }}</a>
        </li>
        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <a class="page-link" (click)="goToPage(currentPage + 1)">Next</a>
        </li>
        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <a class="page-link" (click)="goToPage(totalPages)">Last</a>
        </li>
      </ul>
    </nav>
  </div>
</div>
