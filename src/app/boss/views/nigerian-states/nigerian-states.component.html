<div class="card">
  <div class="card-header">
    Nigerian States
    <button class="btn btn-sm btn-primary float-end" (click)="addNewState()">Add New State</button>
  </div>
  <div class="card-body">
    <table class="table table-bordered table-striped">
      <thead>
        <tr>
          <th>#</th>
          <th>State Name</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let state of states; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ state.name }}</td>
          <td>
            <button class="btn btn-sm" [class.bg-success]="state.enabled" [class.bg-danger]="!state.enabled" (click)="toggleStateStatus(state)">
              {{ state.enabled ? 'Enabled' : 'Disabled' }}
            </button>
          </td>
          <td>
            <button class="btn btn-sm btn-info me-2" (click)="editState(state)">Edit</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
