<div class="card">
  <div class="card-header">
    Nigerian States
    <button class="btn btn-sm btn-primary float-end" (click)="addNewState()">Add New State</button>
  </div>
  <div class="card-body">
    <table class="table table-bordered table-striped">
      <thead>
        <tr>
          <th>#</th>
          <th>State Name</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let state of states; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ getStateName(state) }}</td>
          <td>
            <button class="btn btn-sm text-white" [class.bg-success]="isStateEnabled(state)"
              [class.bg-danger]="!isStateEnabled(state)" (click)="toggleStateStatus(state)">
              {{ isStateEnabled(state) ? 'Enabled' : 'Disabled' }}
            </button>
          </td>
          <td>
            <button class="btn btn-sm btn-info me-2" (click)="editState(state)">Edit</button>
          </td>
        </tr>
        <tr *ngIf="states.length === 0">
          <td colspan="4" class="text-center">No states found.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<c-modal id="liveDemoModal" [visible]="visible" (visibleChange)="handleLiveDemoChange($event)">
  <c-modal-header>
    <h5 cModalTitle>{{ newState.state_id ? 'Edit State' : 'Add New State' }}</h5>
    <button (click)="toggleLiveDemo()" cButtonClose></button>
  </c-modal-header>
  <c-modal-body>
    <form cForm>
      <div class="mb-3">
        <label cLabel for="stateName">State Name</label>
        <input cFormControl id="stateName" placeholder="Enter state name" [(ngModel)]="newState.state_name"
          name="stateName" />
      </div>

    </form>
  </c-modal-body>
  <c-modal-footer>
    <button (click)="toggleLiveDemo()" cButton color="secondary">
      Close
    </button>
    <button cButton color="primary" (click)="submitNewState()">Save changes</button>
  </c-modal-footer>
</c-modal>
