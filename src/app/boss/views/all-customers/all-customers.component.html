<div class="card">
  <div class="card-header">
    All Customers
    <button class="btn btn-sm btn-primary float-end" (click)="addNewCustomer()">Add New Customer</button>
  </div>
  <div class="card-body">
    <div class="row mb-3">
      <div class="col-md-4">
        <input type="text" class="form-control" placeholder="Search customers..." [(ngModel)]="searchTerm" (input)="applyFilters()">
      </div>
      <div class="col-md-3">
        <select class="form-select" [(ngModel)]="filterStatus" (change)="applyFilters()">
          <option value="">All Statuses</option>
          <option value="true">Active</option>
          <option value="false">Inactive</option>
        </select>
      </div>
    </div>
    <table class="table table-bordered table-striped">
      <thead>
        <tr>
          <th>#</th>
          <th>Image</th>
          <th>Name</th>
          <th>Email</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let customer of pagedCustomers; let i = index">
          <td>{{ (currentPage - 1) * itemsPerPage + i + 1 }}</td>
          <td><img [src]="customer.imageUrl" alt="Customer Image" class="customer-thumbnail"></td>
          <td>{{ customer.name }}</td>
          <td>{{ customer.email }}</td>
          <td>
            <button class="btn btn-sm" [class.btn-success]="customer.status" [class.btn-danger]="!customer.status" (click)="toggleCustomerStatus(customer)">
              {{ customer.status ? 'Active' : 'Inactive' }}
            </button>
          </td>
          <td>
            <button class="btn btn-sm btn-info me-2" (click)="editCustomer(customer)">Edit</button>
          </td>
        </tr>
      </tbody>
    </table>
    <nav aria-label="Page navigation">
      <ul class="pagination">
        <li class="page-item" [class.disabled]="currentPage === 1">
          <a class="page-link" (click)="goToPage(1)">First</a>
        </li>
        <li class="page-item" [class.disabled]="currentPage === 1">
          <a class="page-link" (click)="goToPage(currentPage - 1)">Previous</a>
        </li>
        <li class="page-item" *ngFor="let page of totalPagesArray" [class.active]="page === currentPage">
          <a class="page-link" (click)="goToPage(page)">{{ page }}</a>
        </li>
        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <a class="page-link" (click)="goToPage(currentPage + 1)">Next</a>
        </li>
        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <a class="page-link" (click)="goToPage(totalPages)">Last</a>
        </li>
      </ul>
    </nav>
  </div>
</div>
