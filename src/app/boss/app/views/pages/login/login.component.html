<div class="login-page min-vh-100 d-flex align-items-center">
  <c-container breakpoint="lg">
    <c-row class="justify-content-center">
      <c-col lg="11" xl="10">
        <c-card-group class="auth-group">
          <c-card class="hero-panel border-0">
            <c-card-body class="p-4 p-md-5">
              <img class="brand-logo" src="/assets/images/logo.png" alt="Homeworkx" />
              <div #lottieContainer class="lottie-box"></div>
              <div class="hero-copy">
                <h2 class="hero-title">Welcome to Admin</h2>
                <p class="hero-sub">Manage everything with speed and clarity</p>
              </div>
            </c-card-body>
          </c-card>

          <c-card class="form-panel p-4 border-0">
            <c-card-body>
              <form cForm>
                <h1 class="mb-1">Admin Login</h1>
                <p class="text-body-secondary mb-4">Sign in to continue</p>
                
                <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
                  {{ errorMessage }}
                </div>

                <c-input-group class="mb-3">
                  <span cInputGroupText>
                    <svg cIcon name="cilUser"></svg>
                  </span>
                  <input 
                    autoComplete="username" 
                    cFormControl 
                    placeholder="Email or Username" 
                    [(ngModel)]="credentials.email"
                    name="email"
                  />
                </c-input-group>

                <c-input-group class="mb-2">
                  <span cInputGroupText>
                    <svg cIcon name="cilLockLocked"></svg>
                  </span>
                  <input
                    [type]="showPassword ? 'text' : 'password'"
                    autoComplete="current-password"
                    cFormControl
                    placeholder="Password"
                    [(ngModel)]="credentials.password"
                    name="password"
                  />
                  <button type="button" cButton color="light" class="input-action" (click)="togglePassword()">
                    <i [class]="showPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
                  </button>
                </c-input-group>

                <div class="d-flex justify-content-between align-items-center mb-3 small">
                  <label class="form-check-label">
                    <input class="form-check-input me-2" type="checkbox" />
                    Remember me
                  </label>
                  <a class="text-decoration-none" routerLink="/admin/forgot-password">Forgot password?</a>
                </div>

                <button type="button" cButton color="primary" class="w-100 mb-3" (click)="login()" [disabled]="isLoading">
                  <c-spinner *ngIf="isLoading" size="sm" class="me-2"></c-spinner>
                  Login
                </button>

                <!-- <div class="divider">Or continue with</div>

                <div class="social-login d-grid gap-2">
                  <button type="button" cButton color="danger" variant="outline" class="w-100" (click)="loginWithGoogle()">
                    <svg cIcon class="me-2" name="cibGoogle"></svg>
                    Continue with Google
                  </button>
                  <button type="button" cButton color="primary" variant="outline" class="w-100" (click)="loginWithFacebook()">
                    <svg cIcon class="me-2" name="cibFacebook"></svg>
                    Continue with Facebook
                  </button>
                </div> -->

                <div class="text-center mt-4 small">
                  <span class="text-body-secondary">New here?</span>
                  <a routerLink="/admin/register" class="ms-1">Create an account</a>
                </div>
              </form>
            </c-card-body>
          </c-card>
        </c-card-group>
      </c-col>
    </c-row>
  </c-container>
</div>
