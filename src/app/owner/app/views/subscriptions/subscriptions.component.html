<c-row class="g-4">
  <c-col md="12">
    <c-card class="shadow-sm">
      <c-card-header>
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <strong>Active Subscription</strong>
          </div>
          <c-badge color="success">{{ current.status | titlecase }}</c-badge>
        </div>
      </c-card-header>
      <c-card-body>
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div>
            <div class="plan-name">{{ current.name }}</div>
            <div class="plan-price">${{ current.priceMonthly }}/mo • {{ current.periodDays }} days</div>
          </div>
          <div class="text-end">
            <div class="left">{{ daysLeft }} days left</div>
            <div class="expiry">Ends {{ current.end | date:'mediumDate' }}</div>
          </div>
        </div>
        <c-progress class="mb-3" color="info" thin value="{{ progress }}"></c-progress>
        <div class="features">
          <div *ngFor="let f of current.features" class="feature">• {{ f }}</div>
        </div>
      </c-card-body>
    </c-card>
  </c-col>

  <c-col md="12">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h5 class="m-0">Upgrade Plan</h5>
      <button cButton color="primary" (click)="upgrade(upgrades[2])">Quick Upgrade to Business</button>
    </div>
    <c-row class="g-3">
      <c-col md="4" *ngFor="let p of upgrades">
        <c-card class="h-100 plan-card">
          <c-card-header class="d-flex justify-content-between align-items-center">
            <strong>{{ p.name }}</strong>
            <c-badge color="secondary">${{ p.priceMonthly }}/mo</c-badge>
          </c-card-header>
          <c-card-body>
            <ul class="mb-3">
              <li *ngFor="let f of p.features">{{ f }}</li>
            </ul>
            <button cButton color="primary" class="w-100" (click)="upgrade(p)">Choose {{ p.name }}</button>
          </c-card-body>
        </c-card>
      </c-col>
    </c-row>
  </c-col>
</c-row>
