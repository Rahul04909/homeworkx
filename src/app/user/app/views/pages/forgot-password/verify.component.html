<div class="login-page min-vh-100 d-flex align-items-center">
  <c-container breakpoint="lg">
    <c-row class="justify-content-center">
      <c-col lg="11" xl="10">
        <c-card-group class="auth-group">
          <c-card class="hero-panel border-0">
            <c-card-body class="p-4 p-md-5">
              <img class="brand-logo" src="/assets/images/logo.png" alt="Homeworkx" />
              <div #lottieContainer class="lottie-box"></div>
              <div class="hero-copy">
                <h2 class="hero-title">Verify OTP</h2>
                <p class="hero-sub">Enter the code sent to your email or mobile</p>
              </div>
            </c-card-body>
          </c-card>

          <c-card class="form-panel p-4 border-0">
            <c-card-body>
              <form cForm>
                <h1 class="mb-1">Verify OTP</h1>
                <p class="text-body-secondary mb-4">Enter the code sent to {{email}}</p>

                <div class="d-flex justify-content-between mb-4 gap-2">
                  <input type="text" class="form-control text-center p-2" maxlength="1" [(ngModel)]="otp1"
                    (keyup)="onKeyUp($event, 1)" name="otp1" />
                  <input type="text" class="form-control text-center p-2" maxlength="1" [(ngModel)]="otp2"
                    (keyup)="onKeyUp($event, 2)" name="otp2" />
                  <input type="text" class="form-control text-center p-2" maxlength="1" [(ngModel)]="otp3"
                    (keyup)="onKeyUp($event, 3)" name="otp3" />
                  <input type="text" class="form-control text-center p-2" maxlength="1" [(ngModel)]="otp4"
                    (keyup)="onKeyUp($event, 4)" name="otp4" />
                  <input type="text" class="form-control text-center p-2" maxlength="1" [(ngModel)]="otp5"
                    (keyup)="onKeyUp($event, 5)" name="otp5" />
                  <input type="text" class="form-control text-center p-2" maxlength="1" [(ngModel)]="otp6"
                    (keyup)="onKeyUp($event, 6)" name="otp6" />
                </div>

                <button type="button" cButton color="primary" class="w-100 mb-3" (click)="verify()">Verify &
                  Proceed</button>

                <div class="text-center mt-4 small">
                  <span class="text-body-secondary">Didn't receive the code?</span>
                  <a routerLink="/user/forgot-password" class="ms-1">Resend</a>
                </div>
              </form>
            </c-card-body>
          </c-card>
        </c-card-group>
      </c-col>
    </c-row>
  </c-container>
</div>
