<div class="login-page min-vh-100 d-flex align-items-center">
  <c-container breakpoint="lg">
    <c-row class="justify-content-center">
      <c-col lg="11" xl="10">
        <c-card-group class="auth-group">
          <c-card class="hero-panel border-0">
            <c-card-body class="p-4 p-md-5">
              <img class="brand-logo" src="/assets/images/logo.png" alt="Homeworkx" />
              <div #lottieContainer class="lottie-box"></div>
              <div class="hero-copy">
                <h2 class="hero-title">Password updated</h2>
                <p class="hero-sub">Your password has been successfully changed</p>
              </div>
            </c-card-body>
          </c-card>

          <c-card class="form-panel p-4 border-0">
            <c-card-body class="text-center">
              <h1 class="mb-2">Success</h1>
              <p class="text-body-secondary mb-4">You can now sign in with your new password</p>
              <button type="button" cButton color="primary" class="w-100" routerLink="/user/login">Go to Login</button>
            </c-card-body>
          </c-card>
        </c-card-group>
      </c-col>
    </c-row>
  </c-container>
</div>
